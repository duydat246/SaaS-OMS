name: Build & Deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# dev và pull request vào main chỉ chạy test. Chỉ push vào main (tức sau khi merge) mới build image và deploy.
# Không đặt concurrency cấp workflow: cancel-in-progress ở cấp đó huỷ cả job deploy đang chạy dở trên VPS.
# Thay vào đó: test và build-and-push huỷ bản cũ theo từng job, còn deploy xếp hàng không huỷ
# và tự bỏ qua nếu commit không còn là đầu nhánh.
jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend test
        run: mvn -q -B -f backend/pom.xml test

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Frontend build
        run: npm --prefix frontend run build

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: build-and-push-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/saasoms-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/saasoms-backend:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/saasoms-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/saasoms-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # Chạy khi đã giữ group deploy: commit mới đẩy lên sau bước này sẽ xếp hàng và deploy sau, không bị đè.
      # Không đọc được đầu nhánh thì job đỏ, không deploy, vì đè bản cũ tệ hơn deploy chậm.
      - name: Skip if commit is no longer branch head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Bỏ qua deploy: ${GITHUB_SHA} không còn là đầu nhánh ${GITHUB_REF_NAME} (${head_sha})"
          fi

      - name: SSH, pull and health-check on VPS
        if: steps.head.outputs.current == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Mặc định 10m: vòng healthcheck tối đa 6 phút, cộng thời gian pull trên VPS 1 core có thể vượt.
          command_timeout: 20m
          # Không bật script_stop: tuỳ chọn đó tách script theo dòng và làm hỏng vòng for/if; dùng set -e.
          script: |
            set -e
            cd /var/www/saasoms
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            ok=""
            for i in $(seq 1 36); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1/auth/refresh || true)
              if [ "$code" = "400" ]; then ok=1; break; fi
              sleep 5
            done
            if [ -z "$ok" ]; then
              docker compose -f docker-compose.prod.yml logs --tail=100 backend
              exit 1
            fi
            docker image prune -af --filter "until=168h"
