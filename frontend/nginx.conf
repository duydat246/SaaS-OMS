server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Khớp spring.servlet.multipart.max-request-size trong application.yml
    client_max_body_size 6m;

    # CORS do Spring xử lý theo APP_CORS_ALLOWED_ORIGINS, nginx không thêm header CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/ {
        # GET/HEAD /auth/* là route Angular, API xác thực chỉ dùng POST (giống proxy.conf.js)
        if ($request_method ~ ^(GET|HEAD)$) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
