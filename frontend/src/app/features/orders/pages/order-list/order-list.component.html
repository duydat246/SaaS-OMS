<div class="page-fill">
  <div class="page-header">
    <h2>Đơn hàng</h2>
    <a routerLink="/orders/new" tabindex="-1">
      <p-button label="Tạo đơn hàng" icon="pi pi-plus" size="small" />
    </a>
  </div>

  <div class="filter-bar">
    <div class="filter-bar__search">
      <input
        pInputText
        [(ngModel)]="searchText"
        placeholder="Tìm khách hàng hoặc mã đơn..."
        aria-label="Tìm đơn hàng"
        class="w-full"
        (keyup.enter)="applyFilters()"
      />
      @if (searchText) {
        <button
          type="button"
          class="search-clear"
          (click)="clearSearch()"
          aria-label="Xoá tìm kiếm"
        >
          <i class="pi pi-times"></i>
        </button>
      }
    </div>
    <p-dropdown
      [(ngModel)]="selectedStatus"
      [options]="statusOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="Tất cả trạng thái"
      ariaLabel="Lọc theo trạng thái"
      [showClear]="true"
      styleClass="w-full"
      (onChange)="applyFilters()"
    />
    <p-button
      label="Tìm kiếm"
      icon="pi pi-search"
      size="small"
      severity="secondary"
      [outlined]="true"
      (click)="applyFilters()"
    />
  </div>

  <p-table
    [value]="orders()"
    [loading]="loading()"
    [first]="meta().page * meta().size"
    [rows]="meta().size"
    [totalRecords]="meta().totalElements"
    [lazy]="true"
    (onPage)="onPage($event)"
    [paginator]="true"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} / {totalRecords} đơn hàng"
    [scrollable]="true"
    scrollHeight="flex"
    [tableStyle]="{ '--table-min': '720px', '--table-min-md': '0px' }"
    styleClass="p-datatable-sm"
    [rowHover]="true"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Mã đơn</th>
        <th>Khách hàng</th>
        <th class="hide-sm hide-md">Nền tảng</th>
        <th>Trạng thái</th>
        <th class="num">Tổng tiền</th>
        <th class="hide-sm hide-md">Ngày tạo</th>
        <th class="hide-sm" style="width: 52px"><span class="sr-only">Thao tác</span></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-order>
      <tr class="cursor-pointer" (click)="goToDetail(order.id)">
        <td>
          <a class="order-id" [routerLink]="['/orders', order.id]" (click)="$event.stopPropagation()">
            <code>#{{ order.id }}</code>
          </a>
        </td>
        <td>{{ order.customer?.fullName ?? "—" }}</td>
        <td class="hide-sm hide-md">
          <p-tag
            [value]="platformSourceLabelVi(order.platformSource)"
            severity="secondary"
          />
        </td>
        <td>
          <p-tag
            [value]="orderStatusLabelVi(order.status)"
            [severity]="getSeverity(order.status)"
          />
        </td>
        <td class="num font-medium">
          {{ order.totalAmount | currency }}
        </td>
        <td class="muted white-space-nowrap hide-sm hide-md">{{ order.createdAt | date: "dd/MM HH:mm" }}</td>
        <td class="hide-sm" (click)="$event.stopPropagation()">
          <p-button
            icon="pi pi-eye"
            [rounded]="true"
            [text]="true"
            size="small"
            severity="secondary"
            ariaLabel="Xem chi tiết đơn hàng"
            (click)="goToDetail(order.id)"
          />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center py-4 muted">
          Không tìm thấy đơn hàng
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
