spring:
  profiles:
    active: dev
  application:
    name: saas-oms
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      # Mặc định Jackson cắt 1.5 thành 1 cho field Integer/Long, làm đơn hàng sai số lượng mà không báo lỗi.
      accept-float-as-int: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80}
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-chars-long}
    access-token-expiry-ms: 900000 # 15 minutes
    refresh-token-expiry-days: 7
  media:
    storage-dir: ${APP_MEDIA_DIR:uploads}
    signing-secret: ${APP_MEDIA_SECRET:${JWT_SECRET:dev-secret-key-must-be-at-least-32-chars-long}}
    url-ttl-seconds: 3600

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

server:
  port: 8080

---
# Production: không có giá trị mặc định cho secret, thiếu biến thì không khởi động được.
# Đặt ở đây vì backend/.gitignore chặn application-prod.yml, file đó sẽ không vào image CI.
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.saasoms: INFO

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
  media:
    signing-secret: ${APP_MEDIA_SECRET}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
